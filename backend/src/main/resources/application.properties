spring.application.name=shopease

# Context Path (optional)
#server.servlet.context-path=/api

# --- ? MySQL Configuration ---
spring.datasource.url=jdbc:mysql://localhost:3306/shopease_db
spring.datasource.username=root
spring.datasource.password=Hemant@02
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- ? Hibernate/JPA Settings for MySQL ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- ? Mail Settings ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=shopease.platform@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- ? JWT Settings ---
jwt.auth.app=authapp
jwt.auth.secret_key=6590c4c7ace3141a925486ae744f5a49d382f59c27b3b23cee8b9a625f1b7b25
jwt.auth.expires_in=3600

# --- ? Google OAuth2 Login ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH2_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH2_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

# --- ? Payment Gateway ---
#stripe.secret=${STRIPE_SECRET}
stripe.secret=sk_test_YourStripeSecretKeyHere
spring.config.import=optional:file:.env[.properties]

# --- ? File Upload Settings ---
